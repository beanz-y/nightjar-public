# Nightjar release + transparency pipeline (P7/P8, DESIGN 10.1/10.3; DESIGN 10).
#
# Model A (the load-bearing choice, DESIGN 10): the artifact this workflow
# hashes, logs to Rekor, and DEPLOYS is one and the same, so "served bytes ==
# logged hash" holds by construction. Cloudflare's own git-integration auto-build
# MUST be turned OFF (this workflow is the only deploy path), otherwise Cloudflare
# would rebuild from source in its own unpinned builder and the served bytes could
# drift from the logged hash.
#
# Trigger: a push to main (or a manual dispatch). The version comes from the
# committed VERSION file, not from tags: the earlier design's SSH-signed-tag
# ceremony was dropped as operator friction (DESIGN 10.1 records this), and the
# transparency story rests on the digest-pinned container build + the keyless
# Rekor entry, whose OIDC identity names this repo, workflow, and commit.
#
# A `gate` job runs the full test suites and both typechecks first; production
# never receives a build whose KAT-locked crypto suite did not just pass.
#
# One-time setup by the operator (all dashboard/web actions, no local CLI):
#   - Make the repo PUBLIC (scrubbed, DESIGN 10) so public-good Rekor + the
#     rebuild-from-source story work.
#   - Turn OFF Cloudflare Pages/Workers git-integration auto-deploy.
#   - Add repo secrets: CLOUDFLARE_API_TOKEN (a scoped Workers-deploy token created
#     in the CF dashboard) and CLOUDFLARE_ACCOUNT_ID.
#   - Actions permissions already allow id-token: write below (Sigstore keyless).
#
# Supply chain (DESIGN 10): every `uses:` is pinned to a full commit SHA (the
# trailing comment is the tag it was resolved from). To bump one, resolve the
# new tag to its commit (e.g. `git ls-remote https://github.com/actions/checkout
# refs/tags/vX.Y.Z`) and update both the SHA and the comment.

name: release

on:
  push:
    branches: [main]
  # Pull requests run the GATE ONLY (the release job is guarded below), so a
  # dependency-bump PR is built and tested before anyone merges it, and can never
  # reach a deploy. Added after a Dependabot PR was built by a second, unpinned
  # pipeline: validation and deployment must be separable, or the only way to
  # learn a bump breaks the build is to ship it.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Sigstore keyless OIDC -> Rekor

# Two rapid pushes must deploy IN ORDER: a stale build landing last would leave
# production mismatching the newest Rekor entry and the canary's attested hash.
# Keyed by ref so a PR's gate run cannot queue behind (or cancel) a real release.
concurrency:
  group: nightjar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (LF via .gitattributes)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Node from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps
        run: npm ci

      # Known advisories against the SHIPPED surface block a deploy, rather than
      # waiting in an inbox for someone to notice. Two deliberate narrowings:
      #
      #   --omit=dev     only what reaches users. Dev-tree findings (the vitest and
      #                  esbuild chain) do not ship, and failing on them trains
      #                  everyone to ignore a red gate, which costs more than it buys.
      #   --audit-level=high
      #                  critical and high stop the release; moderate and low are
      #                  reported and do not. Otherwise a moderate advisory in a
      #                  transitive dependency would block an unrelated urgent fix,
      #                  which is a worse security outcome than the advisory.
      #
      # This is one source, not two: npm audit and Dependabot both read the GitHub
      # Advisory Database. It is a backstop for an alert that was missed, not
      # independent confirmation, and it cannot see a fix that shipped without an
      # advisory ever being filed. See SECURITY.md.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (app + configs)
        run: npm run typecheck

      - name: Typecheck (worker)
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Unit + integration tests (node)
        run: npm test

      # The production build must be run here for two reasons: it validates that
      # `npm run build` (tsc + vite + the SRI plugin) actually compiles before any
      # deploy, and it creates ./dist, which the relay tests require because
      # wrangler.jsonc points `assets.directory` at it (the workerd test harness
      # aborts on a missing assets directory otherwise). This build is a check
      # only; the deployed artifact is built independently in the pinned container
      # by the release job below.
      - name: Build (production build check + dist for the relay tests)
        run: npm run build

      - name: Relay tests (workerd)
        run: npm run test:worker

  release:
    needs: gate
    runs-on: ubuntu-latest
    # THREE independent guards on the only step that can touch production. Each one
    # alone would have prevented the incident that motivated them (an automated
    # dependency PR reaching a live deploy); together they mean a deploy takes a
    # deliberate human action by design, not by luck.
    #
    #  1. `push` only, so a pull_request run can build and test but never deploy.
    #  2. `main` only, so a workflow_dispatch aimed at a branch cannot ship that
    #     branch. This job has no branch check of its own otherwise, and dispatch
    #     accepts any ref.
    #  3. Never for a bot actor. Dependabot merges, auto-merge rules and any future
    #     automation are excluded by identity rather than by hoping the other two
    #     hold. `github.actor` is who triggered the run, so a human merging a
    #     Dependabot PR is still a human deploy, which is the intent.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'dependabot[bot]' &&
      !endsWith(github.actor, '[bot]')
    # Fourth guard, and the strongest, but it only works once configured: create an
    # environment called `production` in repository settings and add a required
    # reviewer. GitHub then PAUSES this job until a human approves it, and the
    # Cloudflare credentials below are scoped to that environment rather than being
    # readable by every workflow run. Nothing else here can enforce that; see
    # SECURITY.md and DESIGN 10.1.
    environment: production
    # Job-level permissions (these REPLACE the workflow-level block, so id-token
    # must be repeated for cosign): contents:write lets the final step create the
    # version tag + GitHub Release. The gate job keeps the read-only default.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout (LF via .gitattributes)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Version comes from the committed VERSION file, NOT the branch/ref name, so a
      # push to main keeps a stable release version (bump VERSION to cut a new one).
      # A redeploy of unchanged source is then byte-identical, so the canary that
      # attests {version, releaseHash} stays valid without a re-sign.
      - name: Derive the release version (from VERSION)
        # Strip a leading UTF-8 BOM (\357\273\277 = EF BB BF) AND all whitespace:
        # an editor that saves VERSION as "UTF-8 with BOM" (e.g. Windows
        # PowerShell 5.1 `Set-Content -Encoding utf8`) would otherwise bake an
        # invisible U+FEFF into __APP_VERSION__, so the running build would not
        # equal the clean version the canary signs. Then fail loudly if what is
        # left is not a sane version, rather than shipping a malformed one.
        run: |
          NIGHTJAR_VERSION=$(tr -d '\357\273\277[:space:]' < VERSION)
          if ! printf '%s' "$NIGHTJAR_VERSION" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION is not a valid version after normalization: [$NIGHTJAR_VERSION]"
            exit 1
          fi
          echo "NIGHTJAR_VERSION=$NIGHTJAR_VERSION" >> "$GITHUB_ENV"

      - name: Build once inside the digest-pinned container (the canonical artifact)
        run: |
          docker build -f Dockerfile.build \
            --build-arg NIGHTJAR_VERSION="${NIGHTJAR_VERSION}" \
            -t nightjar-build .
          # Extract the exact built tree into ./dist (what gets hashed AND deployed).
          rm -rf dist && mkdir dist
          cid=$(docker create nightjar-build)
          docker cp "$cid:/app/dist/." dist/
          docker rm "$cid"

      - name: Compute the canonical release hash (DESIGN 10)
        id: hash
        run: |
          # NIGHTJAR_VERSION is already in the env from the derive step above.
          node scripts/release-hash.mjs dist
          echo "release_hash=$(sha256sum manifest.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign the manifest into public-good Rekor (keyless)
        run: |
          # Keyless: the signer identity is THIS repo's workflow OIDC token,
          # recorded in the append-only Rekor log. The bundle self-verifies offline.
          cosign sign-blob --yes manifest.txt --bundle manifest.cosign.bundle

      # wrangler bundles the Worker (worker/index.ts) at deploy time, which pulls in
      # its imports (@noble, @scure via the shared src/), so the runner needs the
      # project deps at the SAME node version the project pins. The container
      # build's node_modules stays in the container; the runner has none until now.
      # (dist/ was copied out separately and is unaffected.)
      - name: Node from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deps for the Worker bundle
        run: npm ci

      # Deploy with the project's OWN wrangler, the one `npm ci` just installed from
      # the committed lockfile. This used to go through cloudflare/wrangler-action
      # with a hardcoded `wranglerVersion`, and that pin is what broke this step: it
      # asked the action to install a wrangler DIFFERENT from the lockfile's, into a
      # tree that already had the lockfile's, and npm refused on a peer conflict.
      #
      # Two versions of the same tool in one job was the actual bug, so the fix is to
      # have exactly one. It also suits Model A better: the bytes are deployed by the
      # same audited, lockfile-pinned toolchain that built and hashed them, rather
      # than by something fetched at deploy time. And it takes a third-party action
      # off the one step that holds the Cloudflare credential, which after an
      # accidental second pipeline reached production is a trade worth making.
      #
      # `npx --no` will NOT reach the network: it runs the local binary or fails.
      # wrangler reads both credentials from the environment natively.
      # No build here: `deploy` uploads the already-built ./dist assets + the Worker.
      # keep_vars:true (wrangler.jsonc) preserves dashboard vars/secrets
      # (ADMIN_TOKEN, VAPID_JWK, VAPID_SUBJECT, CANARY_JSON).
      # `--message` is what makes the host's own deployment list useful. A token
      # deploy has no human behind it, so that list shows the actor as unknown, and
      # an unknown row is indistinguishable from one made with a stolen token. It is
      # not the provenance record (Rekor is, and every legitimate deploy has an entry
      # there signed by this workflow's OIDC identity), but a row that names its
      # commit, version, release hash and run turns "who did this" into a question
      # with an answer in the same place it is asked.
      - name: Deploy the exact hashed artifact (Model A)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_HASH: ${{ steps.hash.outputs.release_hash }}
        run: |
          npx --no wrangler deploy \
            --message "CI · ${NIGHTJAR_VERSION} · ${GITHUB_SHA} · hash ${RELEASE_HASH} · run ${GITHUB_RUN_ID}"

      # No tag on a main push, so publish the transparency artifacts to the run
      # instead of a GitHub Release. Rekor (append-only) is the real anchor; these
      # are conveniences an auditor can also regenerate from source. The commit and
      # the release hash are both in the artifact name, so correlating a run to a
      # Rekor entry needs no download.
      - name: Publish the manifest + cosign bundle as run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightjar-${{ env.NIGHTJAR_VERSION }}-${{ github.sha }}-${{ steps.hash.outputs.release_hash }}
          path: |
            manifest.txt
            release.json
            manifest.cosign.bundle

      # Cut a GitHub Release for a NEW version, so the Releases page tracks what is
      # actually live. Idempotent: a push that did NOT bump VERSION (its release
      # already exists) just skips - the redeploy is byte-identical so the canary
      # stays valid. This runs AFTER a successful deploy and uses the built-in
      # GITHUB_TOKEN (no personal CLI/PAT). It does NOT reintroduce the dropped
      # signed-tag DEPLOY trigger: deploys still fire on push-to-main; the tag +
      # Release are created here as a human-readable record pointing at the Rekor
      # entry (the real transparency anchor). The manifest + cosign bundle are
      # attached so an auditor can rebuild from this exact commit and diff the hash.
      - name: Cut a GitHub Release for a new version (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HASH: ${{ steps.hash.outputs.release_hash }}
        run: |
          TAG="${NIGHTJAR_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (unchanged-version redeploy); skipping."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Deployed build ${TAG}. Reproducible-build hash (sha256 of manifest.txt): ${RELEASE_HASH}. Rebuild from this commit and confirm the hash plus the Sigstore/Rekor transparency entry (see docs/VERIFYING.md); the manifest and cosign bundle are attached." \
            manifest.txt release.json manifest.cosign.bundle
